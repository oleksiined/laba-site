  // Generate QR data URL using QRCode.js canvas
  function makeQrDataUrl(text) {
    return new Promise(function(resolve) {
      var container = document.createElement('div');
      container.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:160px;height:160px';
      document.body.appendChild(container);
      try {
        new QRCode(container, {
          text: text, width: 160, height: 160,
          colorDark: '#111111', colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
        setTimeout(function() {
          var canvas = container.querySelector('canvas');
          resolve(canvas ? canvas.toDataURL('image/png') : '');
          document.body.removeChild(container);
        }, 60);
      } catch(e) {
        document.body.removeChild(container);
        resolve('');
      }
    });
  }

  // Parse stored order data
  var stored;
  try { stored = JSON.parse(localStorage.getItem('laba_labels') || 'null'); } catch(e) { stored = null; }

    document.getElementById('error').textContent = 'Дані замовлення не знайдено. Поверніться на сторінку замовлення і знову натисніть «Роздрукувати етикетки».';

    return;
  }

  var subtitle = stored.orderNum ? 'Замовлення ' + stored.orderNum : 'LABA';
  document.getElementById('order-subtitle').textContent = subtitle;

  // Generate QR codes for all samples, then render
  Promise.all(stored.samples.map(function(s) {
    return makeQrDataUrl(s.sample_id);
  })).then(function(qrUrls) {
    stored.samples.forEach(function(s, i) { s.qr_data_url = qrUrls[i]; });

    var script = document.createElement('script');
    script.id = 'laba-renderer';
    script.textContent = window._LABA_RENDERER_SRC;
    document.body.appendChild(script);
  });

 const el=(tag,cls,text)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=String(text);return node;};
 function writingField(label,required=true,full=false){
  const field=el('div','write-field'+(full?' full':''));
  const caption=el('dt',null,label);if(!required)caption.append(el('span','optional',' · за наявності'));field.append(caption);
  const answer=el('dd','write-line');
  if(label==='Протруєння'){
   answer.className='write-choices';for(const text of ['Так','Ні','Невідомо']){const choice=el('span','choice');choice.append(el('span','box'),document.createTextNode(text));answer.append(choice);}
  }else if(/Дата/.test(label)){answer.append(el('span','write-hint','____ . ____ . ________'));}
  else if(label==='Глибина відбору'){answer.append(el('span','write-hint','від ______ до ______ см'));}
  else if(label==='Планова врожайність'){answer.append(el('span','write-hint','________________ т/га'));}
  else if(label==='Час відбору'){answer.append(el('span','write-hint','______ : ______'));}
  field.append(answer);return field;
 }
 function buildShipping(){
  const s=config.shipping;
  if(!s)return null;
  if(['city','branch','recipient','phone'].some(k=>!String(s[k]??'').trim()))return null;
  const block=el('aside','shipping');block.append(el('h2',null,'Куди надіслати зразки'));
  const details=el('div','shipping-details');
  const destination=el('div');destination.append(el('strong',null,'Нова пошта'),el('div',null,s.city+', відділення № '+s.branch));
  const recipient=el('div');recipient.append(el('div',null,'Отримувач: '+s.recipient),el('div',null,'Телефон: '+s.phone));
  details.append(destination,recipient);block.append(details,el('p',null,'Доставка — коштом відправника. Заповнену форму передайте разом зі зразком у LABA.'));return block;
 }
 function qrImage(url,id){
  if(typeof url!=='string'||!/^data:image\/png;base64,[A-Za-z0-9+\/=]+$/.test(url)){const img=el('img','qr');img.alt='QR '+id;return img;}
  const img=el('img','qr');img.src=url;img.alt='QR-код зразка '+id;return img;
 }
 function buildLabel(sample,index,total){
  for(const key of ['sample_id','order_id','material'])if(!String(sample[key]??'').trim())throw new Error('Не заповнено поле '+key+'.');
  if(!Array.isArray(sample.packages))sample.packages=[];
  if(!Array.isArray(sample.standalone_services))sample.standalone_services=[];
  const card=el('article','label');card.dataset.sampleId=sample.sample_id;card.setAttribute('aria-label',sample.material+', '+sample.sample_id);
  const lab=el('section','lab-part');card.append(lab);
  const head=el('div','label-head'), brand=el('div','brand');
  if(config.logo){const img=el('img');img.src=config.logo;img.alt='LABA';brand.append(img);}else brand.append(el('div','brand-text','LABA'));
  const caption=el('div','brand-caption');caption.append(el('div',null,'ЛАБОРАТОРІЯ'),el('div',null,'ДЛЯ АГРОБІЗНЕСУ'));brand.append(caption);
  head.append(brand,el('span','material',sample.material));lab.append(head);
  const identity=el('div','identity'), order=el('div','order-row');
  const orderText=el('span',null,'Замовлення ');orderText.append(el('strong',null,sample.order_id));
  order.append(orderText,el('span',null,'Зразок '+index+' із '+total));
  identity.append(order,el('div','id-caption','Номер зразка LABA'),el('div','sample-id',sample.sample_id));
  const identification=el('div','lab-identification');const qr=el('div','lab-qr');qr.append(qrImage(sample.qr_data_url,sample.sample_id),el('div',null,'ДО ЛАБОРАТОРІЇ'));identification.append(identity,qr);lab.append(identification);
  const facts=el('dl','facts handwriting');
  facts.append(writingField('Назва / позначення зразка клієнтом',true,true));
  for(const field of sample.fields){
   facts.append(writingField(field.label,field.required));
  }
  facts.append(writingField('Дата відбору'));
  const services=el('section','services');
  for(const [items,title] of [[sample.packages,'Пакет'],[sample.standalone_services,sample.packages.length?'Додаткові дослідження':'Дослідження']]){
   if(!items.length)continue;
   services.append(el('div','services-title'+(services.children.length?' secondary':''),title));const list=el('ul');for(const item of items)list.append(el('li',null,item));services.append(list);
  }
  lab.append(services);
  card.append(el('div','cut-line','Відрізати в LABA · верхня частина — до лабораторії'));
  const record=el('section','laba-record'), recordHeader=el('div','record-header');
  const recordId=el('div');recordId.append(el('div','record-caption','ДАНІ ДЛЯ LABA · ЗАЛИШАЮТЬСЯ В LABA'),el('strong','record-id',sample.sample_id));recordHeader.append(recordId,el('span','record-order','Замовлення '+sample.order_id));
  record.append(recordHeader,facts);card.append(record);
  const footer=el('footer','label-footer');const copy=el('div','footer-copy');copy.append(el('strong',null,'Заповніть від руки та передайте зі зразком у LABA'),el('div',null,'Якщо дані невідомі, зазначте «Невідомо».'));
  footer.append(copy);card.append(footer);return card;
 }
 let current=[];
 async function checkFit(){
  await document.fonts.ready;
  await Promise.all(Array.from(root.querySelectorAll('img')).map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;})));
  let bad=[];
  for(const card of root.querySelectorAll('.label')){
   const footer=card.querySelector('.label-footer'), record=card.querySelector('.laba-record');
   const overflow=card.scrollHeight>card.clientHeight+1||card.scrollWidth>card.clientWidth+1||footer.getBoundingClientRect().bottom>card.getBoundingClientRect().bottom-8||record.getBoundingClientRect().bottom>footer.getBoundingClientRect().top+1;
   card.classList.toggle('overflows',overflow);if(overflow)bad.push(card.dataset.sampleId);
  }
  const brokenImages=Array.from(root.querySelectorAll('img')).some(img=>!img.naturalWidth&&img.src&&!img.src.startsWith('data:'));
  const shipping=root.querySelector('.shipping');const shippingOverflow=shipping&&shipping.scrollHeight>shipping.clientHeight+1;
  document.body.classList.toggle('block-print',!!bad.length||brokenImages||!current.length||shippingOverflow);
  printButton.disabled=!!bad.length||brokenImages||!current.length||shippingOverflow;
  error.classList.toggle('visible',!!bad.length||brokenImages||shippingOverflow);
  error.textContent=shippingOverflow?'Реквізити відправлення не вмістилися.':brokenImages?'Не вдалося завантажити зображення.':bad.length?'Текст не вмістився для '+bad.join(', ')+'. Оберіть «2 етикетки на A4».':'';
 }
 function render(){
  root.replaceChildren();error.classList.remove('visible');printButton.disabled=true;
  current=config.samples.filter(s=>filter.value==='all'||s.material_code===filter.value);
  const hasShipping=config.shipping&&['city','branch','recipient','phone'].every(k=>String(config.shipping[k]??'').trim());
  document.body.classList.toggle('wide',layout.value==='2');const perPage=Number(layout.value);let page,count=0,capacity=perPage/2,pageNo=0;
  try{
   current.forEach(s=>{
    const isFirst=pageNo===0;
    if(!page||count>=capacity){
     pageNo++;const cls=pageNo===1&&hasShipping?'page first-page':'page';
     page=el('section',cls);page.setAttribute('aria-label','Аркуш '+pageNo);root.append(page);count=0;
     capacity=pageNo===1&&hasShipping?perPage/2:perPage;
     if(pageNo===1&&hasShipping)page.append(buildShipping());
    }
    page.append(buildLabel(s,config.samples.indexOf(s)+1,config.samples.length));count++;
   });
   document.getElementById('count').textContent=current.length+' етикеток';
   checkFit();
  }catch(err){root.replaceChildren();error.textContent=err.message;error.classList.add('visible');document.body.classList.add('block-print');}
 }
 filter.addEventListener('change',render);layout.addEventListener('change',render);
 printButton.addEventListener('click',async()=>{await checkFit();if(!printButton.disabled)window.print();});
 window.addEventListener('resize',()=>checkFit());
 window.addEventListener('beforeprint',()=>{if(printButton.disabled)document.body.classList.add('block-print');});
 window.LabaLabels={render,checkFit};render();
})();
